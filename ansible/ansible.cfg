[defaults]
# Ansible configuration for k3s-ansible via ansible-galaxy

# Inventory configuration
inventory = ./inventory.yml

# Galaxy role path - installed roles will be available here
roles_path = ~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

# Vault password file - reads from .vault-password or ANSIBLE_VAULT_PASSWORD_FILE env var
# vault_password_file = .vault-password

# Privilege escalation
# [privilege_escalation]
# become = True
# become_method = sudo
# become_ask_pass = True

# Connection defaults
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
